name: CI

# PR では品質チェックだけを行う。main への push では品質チェックの後に検証環境へデプロイし、
# 本番は承認を経て進める（ADR-0003。手順・設定は docs/Deployment.md「ビルドとデプロイ」）。
# デプロイを含む main への push には paths フィルタを付けず、[skip ci] も使わない（main の最新の確認を通る実行がなくなるため。ADR-0003 決定 3）。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# PR は同じブランチの古い実行を取り消す。main への push の実行は run_id で実行ごとに別のグループにし、
# ワークフロー単位では取り消さない（デプロイ中の実行を中断しないため）。デプロイの順序は、
# ジョブ単位の concurrency とデプロイ直前の main の最新の確認で守る（ADR-0003 決定 3）。
concurrency:
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint / Format / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        # SHA 固定（サプライチェーン攻撃対策）。
        # checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        # setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Setup Node
        # setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Format check (Biome)
        run: bun run format:check

      - name: Typecheck (next typegen + tsc --noEmit)
        run: bun run typecheck

      - name: Test (Vitest)
        run: bun run test

      # main への push では、デプロイのジョブが環境ごとの値でビルドするため、ここでのビルドは PR だけで行う。
      # デプロイと同じ OpenNext のビルド（内部で next build も行う）にし、OpenNext 固有の失敗（#342 など）を PR で見つける。
      # トークンは使わない。成果物はデプロイしない。
      - name: Build (OpenNext, staging)
        if: github.event_name == 'pull_request'
        run: ./node_modules/.bin/opennextjs-cloudflare build --env staging
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # next.config.ts の分岐を検証環境のビルドに揃える。
          NEXT_PUBLIC_USE_MSW: "false"
          USE_DEV_ASSETS: "true"
          # NEXT_PUBLIC_* は渡さない。getSupabase() は遅延初期化のため、プリレンダリングで呼ばれない限りビルドに要らない。
          # 将来サーバ側から呼ぶようになったら、このビルドが失敗して気づける（リポジトリの Variables は使わない。docs/Deployment.md「環境変数」）。

  deploy-staging:
    name: Deploy (staging)
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Variables・Secrets は staging Environment に置く。staging は main だけがデプロイでき、管理者のバイパスを無効にしておく（ADR-0003 決定 2）。
    environment: staging

    # Cloudflare のトークンを扱うジョブに GitHub への書き込み権限を渡さない（ADR-0003 決定 3）。
    permissions:
      contents: read

    # 検証環境へのデプロイは同時に 1 つだけにし、途中で中断しない。待機中のジョブを取り消さないよう queue: max にする（ADR-0003 決定 3）。
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
      queue: max

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # 接続先の期待値（ブラウザに渡る公開の値）。staging Environment に定義し忘れると同じ名前のリポジトリの Variables が使われるため、
      # 期待値は変数から取らずにここへ書き、ビルドの前に比べる（docs/Deployment.md「環境変数」）。
      EXPECTED_API_BASE_URL: https://natueve-api-stg.natuportal.org
      # ローカル開発の Auth 用プロジェクト（検証環境は開発と Auth を共有する。NatuEve_API ADR-0041）。
      EXPECTED_SUPABASE_URL: https://mxtjfurilkrewjdwslxl.supabase.co

    steps:
      - name: Checkout
        # checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # push された main の先頭のコミット。同じ実行の中と再実行で変わらない（ADR-0003 決定 3）。
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        # setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Setup Node
        # setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check connection variables
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          failed=0
          if [ "$NEXT_PUBLIC_API_BASE_URL" != "$EXPECTED_API_BASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL が検証用の API（${EXPECTED_API_BASE_URL}）ではありません（実際: ${NEXT_PUBLIC_API_BASE_URL:-未設定}）。staging Environment の Variables を確認してください。"
            failed=1
          fi
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL が検証用の Auth（${EXPECTED_SUPABASE_URL}）ではありません（実際: ${NEXT_PUBLIC_SUPABASE_URL:-未設定}）。staging Environment の Variables を確認してください。"
            failed=1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY が未設定です。staging Environment の Variables を確認してください。"
            failed=1
          else
            # 公開キー（JWT）の ref が URL のプロジェクトと同じか、role が anon かを確かめる。
            # 別のプロジェクトのキーではログインが壊れ、service_role などの秘密のキーはブラウザに渡る JS に埋め込まれてしまうため。
            # 許可するものだけを通す: 照合できた JWT と、中身を確かめられない公開用の sb_publishable_（警告だけ）。それ以外は失敗させる。
            expected_ref="${EXPECTED_SUPABASE_URL#https://}"
            expected_ref="${expected_ref%%.*}"
            case "$NEXT_PUBLIC_SUPABASE_ANON_KEY" in
              sb_publishable_*)
                echo "::warning::NEXT_PUBLIC_SUPABASE_ANON_KEY が JWT ではないため、プロジェクトを確かめられません。"
                ;;
              *)
                claims="$(node -e '
                  const parts = process.argv[1].split(".");
                  if (parts.length !== 3) process.exit(0);
                  try {
                    const p = JSON.parse(Buffer.from(parts[1], "base64url").toString());
                    process.stdout.write(`${p.ref ?? ""} ${p.role ?? ""}`);
                  } catch {}
                ' -- "$NEXT_PUBLIC_SUPABASE_ANON_KEY")"
                if [ "$claims" != "${expected_ref} anon" ]; then
                  echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY が検証用の Auth（${expected_ref}）の anon キーではありません（実際: ${claims:-JWT として読めない}）。staging Environment の Variables を確認してください。"
                  failed=1
                fi
                ;;
            esac
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID が未設定です。staging Environment の Variables を確認してください。"
            failed=1
          fi
          exit "$failed"

      # トークンを渡さずにビルドする（ビルドは依存パッケージのコードも動かすため。ADR-0003 決定 3）。
      # NEXT_PUBLIC_* と USE_DEV_ASSETS はビルド時に埋め込まれる・反映される。
      - name: Build (OpenNext)
        # bunx は手元にないパッケージを npm から取って動かすため、node_modules の bin を直接呼ぶ。
        run: ./node_modules/.bin/opennextjs-cloudflare build --env staging
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # ビルド時のフラグは Environment に置かず、ここに固定する（docs/Deployment.md「環境変数」）。
          NEXT_PUBLIC_USE_MSW: "false"
          # 検証環境は開発用の R2（assets-dev.natuportal.org）の画像を表示する（#353）。
          USE_DEV_ASSETS: "true"

      # 実行の待機中に main が進んでいたら、古いコミットで上書きしないよう止める（ADR-0003 決定 3）。
      - name: Check this run is the latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" || {
            echo "::error::main の最新のコミットを取得できませんでした。デプロイしません。"
            exit 1
          }
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::この実行のコミット（${GITHUB_SHA}）は main の最新（${latest}）ではありません。デプロイしません。最新のコミットは、それを含む後の実行で出してください。"
            exit 1
          fi

      # トークンはこのステップにだけ渡す。opennextjs-cloudflare deploy はビルドしない。
      - name: Deploy (Cloudflare Workers)
        run: ./node_modules/.bin/opennextjs-cloudflare deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "検証環境にデプロイしたコミット: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # 本番の承認待ちを確かめるための確認用のジョブ。ビルド・デプロイをせず、トークンも使わない（ADR-0003 決定 3）。
  # production Environment に Required reviewers と Prevent self-review を設定し、承認待ちになることを確かめてから、
  # 本番のビルド・デプロイのステップを足す（承認待ちにならなかったときに本番へ出てしまわないよう、確認はデプロイしないジョブで行う）。
  approve-production:
    name: Approve (production)
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment: production

    permissions: {}

    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max

    steps:
      - name: Summary
        run: |
          echo "本番の承認を確認したコミット: \`${GITHUB_SHA}\`（確認用のジョブのため、本番へはデプロイしていない）" >> "$GITHUB_STEP_SUMMARY"
