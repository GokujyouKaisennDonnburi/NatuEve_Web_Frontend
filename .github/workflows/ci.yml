name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR は古い実行をキャンセルするが、main への push（デプロイ job を含む）はキャンセルしない。
  # 変更がないと連続マージ時に実行中のデプロイが中断されるため（#330）。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint / Format / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Format check (Biome)
        run: bun run format:check

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Test (Vitest)
        run: bun run test

      - name: Build (Next.js)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # NEXT_PUBLIC_* は静的プリレンダリング時に getSupabase() が呼ばれた場合に必要。
          # 遅延初期化（getSupabase()）によりモジュールロード時は不要だが、
          # 将来サーバ側から呼ばれる可能性に備えリポジトリの Variables から注入する。
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy (production)
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: production

    permissions:
      contents: read

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 本番用の値は production Environment の Secrets / Variables から注入する。
      # CI には .env.local がないため、docs/Deployment.md の「ローカルの値が混ざる」問題は起きない。
      # NEXT_PUBLIC_USE_MSW は変数化せず false を直書きする（設定ミスでモック認証が有効になるのを防ぐ）。
      # NEXT_PUBLIC_* の値はビルド時にコードへ埋め込まれる。
      - name: Deploy (Cloudflare Workers)
        run: bun run deploy
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_USE_MSW: "false"