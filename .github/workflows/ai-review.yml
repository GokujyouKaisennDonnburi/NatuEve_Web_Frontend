name: AI Review

# PR作成時・更新時に OpenCode (OpenCode Go / GLM-5.3 Flash) でコードレビューを実行し、PR へレビューコメントを投稿する。
# レビュー範囲はエージェントが決める。前回のAIレビューコメント末尾の `<!-- reviewed-sha: ... -->` を読み、
# 無ければPR全体、あれば前回以降の差分をレビューする（.ai/prompts/code-review.md「レビュー範囲」）。
# 本ワークフローは Branch Protection の必須チェックには含めない（AIサービス障害時のマージブロック回避）。
#
# AI実行基盤・モデルの変更箇所（将来 Copilot / Claude / Gemini に切替する場合）:
#   1. `uses:` の Action          -> 各サービスの GitHub Action に差し替え
#   2. `env:` の APIキー            -> 切替先プロバイダのAPIキー Secret に変更（OpenCode Go / Zen は OPENCODE_API_KEY）
#   3. opencode.json              -> provider / agent.code-reviewer.model を更新（CI の with.model は jq で自動取得）
#   4. .ai/prompts/code-review.md -> `<pull_request>` など OpenCode Action の入力に依存する「レビュー範囲」を見直す
#   ※ Branch Protection の必須 status check には含めないこと

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Review (OpenCode Go + GLM-5.3 Flash)
    # forkからのPRでは実行しない。加えて、botが発行したイベントも対象外にする。OpenCode Actionは
    # イベント発行者の権限をチェックするが、botユーザーはcollaborator権限として解決されず
    # （permission: none）、実行が失敗するため。
    if: "github.event.pull_request.head.repo.full_name == github.repository && !endsWith(github.actor, '[bot]')"
    runs-on: ubuntu-latest
    # 権限の確認待ちなどで止まったときに、6 時間（既定の上限）待たずに失敗させる
    timeout-minutes: 15

    # use_github_token: true のため OIDC は使われず id-token: write は不要
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        # SHA 固定（サプライチェーン攻撃対策）。checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Resolve review model
        id: model
        shell: bash
        run: |
          echo "model=$(jq -r '.agent["code-reviewer"].model' opencode.json)" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode review
        # opencode v1.19.3
        uses: anomalyco/opencode/github@e3c4eb242585dcd77be1a867391b7c25fd47ce52
        env:
          # AIプロバイダ変更時はここを差し替え（例: ANTHROPIC_API_KEY / OPENAI_API_KEY / GOOGLE_GENERATIVE_AI_API_KEY）。
          # OpenCode Go / OpenCode Zen は OPENCODE_API_KEY を使用。
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Action は agent 入力を読まず、設定の default_agent（未設定なら build）を使う。
          # ローカルの既定エージェントを変えないよう、opencode.json ではなくここで指定する。
          OPENCODE_CONFIG_CONTENT: '{"default_agent":"code-reviewer"}'
        with:
          # モデルは opencode.json の agent.code-reviewer.model を単一正とし、jq で解決して渡す。
          # モデル変更時は opencode.json のみを更新する（CI / ローカルが常に同期）。
          # 現在: OpenCode Go GLM-5.3 Flash。
          model: ${{ steps.model.outputs.model }}
          variant: max
          use_github_token: true
