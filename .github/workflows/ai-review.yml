name: AI Review

# PR作成時に OpenCode (Z.AI / GLM) でコードレビューを実行し、PR へレビューコメントを投稿する。
# 本ワークフローは Branch Protection の必須チェックには含めない（AIサービス障害時のマージブロック回避）。
#
# AI実行基盤・モデルの変更箇所（将来 Copilot / Claude / Gemini に切替する場合）:
#   1. `uses:` の Action          -> 各サービスの GitHub Action に差し替え
#   2. `with.model:`              -> `<provider>/<model-id>` 形式で指定
#   3. `env:` の APIキー            -> 切替先プロバイダのAPIキー Secret に変更
#   4. opencode.json              -> CI/ローカル共通設定（provider/agentのみ更新）
#   5. .opencode/agents/code-reviewer.md -> ローカル用 model: を同値に更新
#   ※ .ai/prompts/code-review.md は AIサービス非依存のため変更不要
#   ※ Branch Protection の必須 status check には含めないこと

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Review (OpenCode + GLM)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # OpenCode Action の最小権限。
    # レビューコメントは OpenCode GitHub App のインストールトークンで投稿されるため、
    # ワークフローの GITHUB_TOKEN には書き込み権限は不要。
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'body<<EOF'
            cat .ai/prompts/code-review.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          # AIプロバイダ変更時はここを差し替え（例: ANTHROPIC_API_KEY / OPENAI_API_KEY / GOOGLE_GENERATIVE_AI_API_KEY）。
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        with:
          # モデル変更時はここを差し替え（例: anthropic/claude-sonnet-4-20250514 / openai/gpt-5 / zai/glm-4.7）。
          # 現在: Z.AI GLM-4.7-Flash（無料, $0.00/$0.00）。機能強化版が必要な場合は glm-4.7 や glm-4.7-flashx($0.07/$0.40)。
          model: zai/glm-4.7-flash
          prompt: ${{ steps.prompt.outputs.body }}